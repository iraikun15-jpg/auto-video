# 日本史キットのサンプル（書き方は docs/history-kit.md）
タイトル: サンプル「小野妹子は女性だったのか」

見た目:
  舞うもの: 蓮の花びら      # 金の小片・白い羽根・杉の葉・光の粒・漂う漢字・銅鏡のきらめき・波紋・八雲・蓮の花びら・忍冬唐草
  転換: 巻物                # 紙めくり・巻物・御簾・剣閃・X線・ページめくり・襖・雲・色帯・光背
  札の色: 藍
  主役: { 種類: 貴人, 色: 藍, ふち: 金 }

音:
  楽器: 古琴                # 箏・琵琶・古琴・木琴
  音階: 宮                  # 律・陽・陰・宮
  鈴: true

場面:
  - 型: フック
    秒: 3
    大見出し: [名前に「子」、, 実は男性？]
    札: 遣隋使の小野妹子
    判子: 男性？

  - 型: 紹介
    秒: 8
    見出し: 推古朝の外交官
    名前: { 大: 小野妹子, 読み: おののいもこ, 注: 「子」は男性の名にも }
    判子: { 文: 男性, 秒: 6 }

  - 型: 年表
    秒: 8
    見出し: 遣隋使のあゆみ
    項目:
      - { 年: 600年, 文: 最初の遣隋使（隋書） }
      - { 年: 607年, 文: 妹子が国書を届ける }
      - { 年: 608年, 文: 隋の使いと帰国 }
    札: 推古天皇・聖徳太子の時代

  - 型: 地図
    秒: 7
    見出し: 都から隋へ
    地点:
      - { 名前: 難波, 経度: 135.5, 緯度: 34.68 }
      - { 名前: 筑紫, 経度: 130.4, 緯度: 33.6 }
    札: ここから海を渡って隋へ
    部品:
      - { 名前: 舟, x: 300, y: 1080, 大きさ: 0.8, 秒: 4 }

  - 型: 対比
    秒: 8
    見出し: 二つの記録
    左: { 見出し: 日本書紀, 項目: [返書を失くした, と報告], 質感: 記録 }
    右: { 見出し: 隋書, 項目: [皇帝は国書に, 不快を示した], 色: 朱 }
    判子: { 文: 食い違い, 秒: 5.5 }

  - 型: IF
    秒: 8
    見出し: もしも対等の国書でなかったら
    史実: [対等の書き方, 隋の使いが来日, 交流が続く]
    もしも: [へりくだった国書, 冊封の一国に？]

  - 型: 判定
    秒: 6
    判定: [妹子は男性, 名前で誤解されがち]
    金: 確実
    札: 古代の「子」は男性の名にも使われた

  - 型: 二択
    秒: 5
    A: [女性だと, 思ってた派]
    B: [知ってた, 派]

  - 型: 登録
    秒: 5

サムネイル:
  文字: [小野妹子は, 女性だったのか]
  判子: 女性？
  部品:
    - { 名前: 舟, x: 820, y: 1260, 大きさ: 1.0 }
