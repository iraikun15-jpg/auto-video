name: Render video

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write # Releaseの作成に必要

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Google Drive アップロード用（未登録なら空になり、アップロードはスキップ）
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Japanese fonts and ffmpeg (for frame check)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Render episode 2
        run: |
          npm run render
          cat out/ep2/ep2_timing.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render history ch. Jimmu short (paper cutout)
        run: |
          START=$(date +%s)
          npm run render:jimmu
          cat out/jimmu/jimmu_timing.md >> "$GITHUB_STEP_SUMMARY"
          echo "### 神武東征 Short: レンダリング $(( $(date +%s) - START )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: Render history ch. Yamato Takeru short (with BGM and SFX)
        run: |
          START=$(date +%s)
          npm run render:takeru
          cat out/takeru/takeru_timing.md >> "$GITHUB_STEP_SUMMARY"
          echo "### ヤマトタケル Short: レンダリング $(( $(date +%s) - START )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: Render history ch. Sujin short (with BGM and SFX)
        run: |
          START=$(date +%s)
          npm run render:sujin
          cat out/sujin/sujin_timing.md >> "$GITHUB_STEP_SUMMARY"
          echo "### 崇神 Short: レンダリング $(( $(date +%s) - START )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: Render history ch. Kusanagi short (mythic fantasy, with BGM and SFX)
        run: |
          START=$(date +%s)
          npm run render:kusanagi
          cat out/kusanagi/kusanagi_timing.md >> "$GITHUB_STEP_SUMMARY"
          echo "### 草薙剣 Short: レンダリング $(( $(date +%s) - START )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: Render history ch. Yuryaku short (with BGM and SFX)
        run: |
          START=$(date +%s)
          npm run render:yuryaku
          cat out/yuryaku/yuryaku_timing.md >> "$GITHUB_STEP_SUMMARY"
          echo "### 雄略 Short: レンダリング $(( $(date +%s) - START )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: Render history ch. Himiko short (with BGM and SFX)
        run: |
          START=$(date +%s)
          npm run render:himiko
          cp out/himiko/himiko_full.mp4 out/video.mp4
          cat out/himiko/himiko_timing.md >> "$GITHUB_STEP_SUMMARY"
          echo "### 卑弥呼 Short: レンダリング $(( $(date +%s) - START )) 秒" >> "$GITHUB_STEP_SUMMARY"

      - name: Render low-poly 3D test
        run: |
          START=$(date +%s)
          npx remotion render src/index.ts KaijuTest out/kaiju_test.mp4 --codec=h264 --muted --gl=swangle --log=warn
          echo "### ローポリ3Dテスト v1: レンダリング $(( $(date +%s) - START )) 秒（270フレーム）" >> "$GITHUB_STEP_SUMMARY"
          START=$(date +%s)
          npx remotion render src/index.ts KaijuTestV2 out/kaiju_test_v2.mp4 --codec=h264 --muted --gl=swangle --log=warn
          echo "### ローポリ3Dテスト v2: レンダリング $(( $(date +%s) - START )) 秒（270フレーム）" >> "$GITHUB_STEP_SUMMARY"

      - name: Render kaiju v4 (city destruction, with synthesized audio)
        run: |
          node scripts/synth-kaiju-v4.mjs
          START=$(date +%s)
          npx remotion render src/index.ts KaijuV4 out/kaiju_v4.mp4 --codec=h264 --gl=swangle --log=warn
          echo "### 本編テスト v4: レンダリング $(( $(date +%s) - START )) 秒（1200フレーム）" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$TAG" \
            out/video.mp4 out/himiko/* out/yuryaku/* out/kusanagi/* out/sujin/* out/takeru/* out/jimmu/* out/ep2/* out/kaiju_test.mp4 out/kaiju_test_v2.mp4 out/kaiju_v4.mp4 \
            --target "$GITHUB_SHA" \
            --title "動画 #${{ github.run_number }} (${GITHUB_REF_NAME} @ ${SHORT_SHA})" \
            --notes "ブランチ \`${GITHUB_REF_NAME}\` のコミット ${SHORT_SHA} から自動レンダリングした動画です。video.mp4 と himiko_full.mp4 は同じ（もしも日本史ラボ 第6本「卑弥呼は実在したのか」・BGM と効果音入り・ナレーションなし）、himiko_full_light.mp4 はその軽量版、himiko_thumbnail.png はサムネイル、himiko_timing.md はタイミング表。yuryaku_* は第5本「雄略天皇は実在したのか」、kusanagi_* は第4本「草薙剣は本当にあったのか」、sujin_* は第3本「本当の初代天皇は崇神？」、takeru_* は第2本「ヤマトタケルは実在したのか」、jimmu_full.mp4 は第1本「神武天皇は実在したのか」（無音）、jimmu_seg1〜9 はセグメント別、jimmu_thumbnail.png はサムネイル、jimmu_timing.md はタイミング表。ep2_full.mp4 は第2話（無音）の結合版、ep2_seg1〜5 はセグメント別、ep2_timing.md はタイミング表、kaiju_test.mp4 / kaiju_test_v2.mp4 はローポリ3Dテスト（v1/v2）、kaiju_v4.mp4 は本編テスト v4（東京破壊・音あり）です。" \
            --latest

      - name: Upload to Google Drive
        # Secretsが未登録のあいだはこのステップをスキップします
        if: ${{ env.GDRIVE_REFRESH_TOKEN != '' }}
        run: |
          node scripts/upload-to-drive.mjs out/video.mp4 \
            "video-${{ github.run_number }}-${GITHUB_SHA::7}.mp4"
