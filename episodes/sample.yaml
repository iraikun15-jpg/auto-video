# 台本ファイルのサンプル（書き方は docs/script-format.md）
タイトル: サンプル「定時ダッシュ」
公開: false          # true にすると push のたびに書き出して Release に載せる

背景: 床
小道具:
  - { 種類: 椅子, x: 420 }
  - { 種類: 机, x: 620 }

登場人物:            # 先に書いた人ほど奥に描かれる
  上司: { 色: 赤, x: -150 }
  主人公: { 色: 黒, x: 480, ポーズ: 座ってタイピング, 最初から: true }

セグメント:
  - id: seg1
    内容: 定時まであと1分
    秒: 3
    台本: 「よし、定時だ」
    動き:
      - [0, 主人公, 座ってタイピング]
      - [1.6, 主人公, 座って伸び, { 動き方: はずむ }]
      - [1.7, 主人公, キラキラ, { 時間: 1.0 }]
    文字:
      - { 秒: 1.6, 文: "定時だ！" }

  - id: seg2
    内容: 帰ろうとした瞬間
    秒: 4
    台本: 「お先に失礼しま…」「ちょっといい？」
    動き:
      - [0, 主人公, 立つ, { x: 470, 時間: 0.4 }]
      - [0.5, 主人公, 走る, { 到着: 300, のち: 手を振る }]
      - [1.4, 上司, 歩く, { 到着: 60, のち: 指さし }]
      - [2.2, 主人公, 驚く, { 向き: 左, 動き方: ため }]
      - [2.4, 主人公, 震える]
      - [2.2, 主人公, びっくり]
      - [2.2, 画面, 揺れ]
      - [2.5, 主人公, 汗, { 時間: 1.2 }]
    文字:
      - { 秒: 2.0, 文: "ちょっと／いい？", 色: 赤 }

  - id: seg3
    内容: オチ
    秒: 3
    台本: 「……はい」
    動き:
      - [0, 主人公, 崩れ落ちる, { 時間: 0.5 }]
      - [0.2, 上司, うなずく, { 回数: 2 }]
      - [1.2, 上司, 腕組み]
      - [0.3, 主人公, どんより, { 時間: 2.4 }]
      - [0.3, 画面, 暗くなる, { 時間: 2.4 }]

サムネイル:
  セグメント: seg2
  秒: 2.9
  文字:
    - { 文: "定時ダッシュ", 位置: 上 }
